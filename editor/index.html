<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Factory — Editor mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070808; --panel:#0f1011; --panel2:#161719; --panel3:#1c1d20;
  --line:#232528; --line2:#2f3236;
  --text:#ecedee; --mute:#8d9196; --dim:#5b5f64;
  --acc:#52b788; --acc2:#6fdcc0; --accBg:#0f2019;
  --ph:#4b8dff;
  --c-video:#3f9c86; --c-audio:#2f7a69; --c-hl:#6d5fd3; --c-sub:#c88a45; --c-dsc:#737a84;
  --tlh:330px; --headw:132px;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#2c2f33 transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2d31;border-radius:8px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:#3a3e44}
::-webkit-scrollbar-corner{background:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-rows:52px minmax(0,1fr);height:100vh}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.badge{padding:3px 12px;border-radius:999px;font-size:13px;border:1px solid}
.badge.g{color:var(--acc);border-color:#1f4a38;background:#0c1b15}
.badge.b{color:#7aa7ff;border-color:#1f3160;background:#0d1530}
.fname{font-weight:500;font-size:15px;margin-left:4px}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:8px;color:var(--mute)}
.ibtn:hover{color:var(--text);border-color:#454950}
.top .sp{flex:1}
.mock{font-size:12px;color:var(--dim)}

/* work grid */
.work{display:grid;grid-template-columns:300px minmax(0,1fr) 372px;grid-template-rows:minmax(0,1fr) var(--tlh);min-height:0}
.nav{grid-column:1;grid-row:1;border-right:1px solid var(--line);overflow:auto;padding:14px 12px}
.stage{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.insp{grid-column:3;grid-row:1/3;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.tl{grid-column:1/3;grid-row:2;border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;background:var(--panel)}

/* nav */
.blk{margin-bottom:18px}
.blk-h{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:12px;font-weight:500;margin:0 4px 8px}
.mhead{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;margin-bottom:6px}
.mhead:hover{border-color:var(--line2);background:var(--panel2)}
.mhead .chev{color:var(--mute);transition:transform .15s}
.mhead.open .chev{transform:rotate(90deg)}
.mhead .nt{font-weight:600;font-size:13.5px;flex:1}
.mhead .cnt{font-size:11.5px;color:var(--mute)}
.mhead .imp{color:var(--mute);display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 8px;border:1px solid var(--line2);border-radius:6px}
.mhead .imp:hover{color:var(--text)}
.mbody{padding:2px 0 6px 6px}
.blk-h button{color:var(--mute);display:flex;align-items:center;gap:5px;font-size:12px;padding:3px 8px;border:1px solid var(--line2);border-radius:6px}
.blk-h button:hover{color:var(--text)}
.media{display:flex;align-items:center;gap:10px;padding:6px;border-radius:9px;border:1px solid transparent;cursor:grab}
.media:hover{background:var(--panel2);border-color:var(--line)}
.media canvas,.media .mth{width:30px;height:48px;border-radius:5px;background:#222;flex:none;object-fit:cover}
.media .mi{flex:1;min-width:0}
.media .mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.media .md{font-size:11.5px;color:var(--mute)}
.media .md.err{color:#e0806a}
.media .add{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line2)}
.media .add:hover{color:var(--acc2);border-color:var(--acc)}
.drop{border:1px dashed var(--line2);border-radius:9px;padding:10px;color:var(--dim);font-size:12px;text-align:center;margin-top:6px}

.nv{display:flex;align-items:center;gap:10px;padding:0 10px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);margin-bottom:6px;cursor:pointer;position:relative}
.nv:hover{border-color:var(--line2);background:var(--panel2)}
.nv.act{border-color:#2d6b54;background:var(--accBg)}
.nv.act::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--acc)}
.nv .ic{color:var(--mute)}
.nv.act .ic{color:var(--acc2)}
.nv .nt{font-weight:600;font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .sum{font-size:11.5px;color:var(--mute);white-space:nowrap}
.nv.child{height:34px;margin-left:18px;background:transparent;border-color:transparent}
.nv.child .nt{font-weight:500;font-size:13px;color:#c6c8cb}
.nv.child:hover{background:var(--panel2)}
.nv.child.act{background:var(--accBg);border-color:#2d6b54}
.nv .dot{width:8px;height:8px;border-radius:2px;flex:none}
.kb{color:var(--dim);font-size:11.5px;line-height:1.8;margin:6px 4px}
.kb kbd{font:inherit;font-size:11px;padding:0 5px;border:1px solid var(--line2);border-radius:4px;color:var(--mute)}

/* switch */
.sw{width:42px;height:24px;border-radius:999px;background:#2a2c30;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#15171a;border:1px solid #40444a;transition:left .15s}
.sw.on{background:var(--acc)}
.sw.on::after{left:21px;border-color:#123}

/* stage */
.script{padding:10px 24px;color:#c7c9cc;font-size:13.5px;max-width:880px;margin:0 auto;text-align:center;border-bottom:1px solid transparent}
.monitor{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:18px 20px}
.monitor{position:relative;overflow:hidden}
.monitor.hand{cursor:grab}
.monitor.panning,.monitor.panning *{cursor:grabbing!important}
.monitor.hand .hl{cursor:grab}
.frame{will-change:transform;transform-origin:50% 50%;position:relative;height:100%;aspect-ratio:9/16;max-width:100%;background:#000;overflow:visible;container-type:inline-size;box-shadow:0 0 0 1px var(--line)}
.cclip{position:absolute;inset:0;overflow:hidden}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
#clipLayer{position:absolute;left:0;top:0;will-change:transform}
#tfbox{position:absolute;inset:0;width:100%;height:100%;z-index:1002;pointer-events:none;overflow:visible}
#tfbox .edge{fill:none;stroke:#a9d6cc;stroke-width:1;vector-effect:non-scaling-stroke}
#tfbox .hnd{fill:#a9d6cc;stroke:#0b0c0d;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:all}
#tfbox .anc{pointer-events:all;cursor:move}
#tfbox .anc circle,#tfbox .anc path{fill:none;stroke:rgba(223,233,230,.55);stroke-width:1;vector-effect:non-scaling-stroke}
#tfbox .anc .bg{stroke:rgba(0,0,0,.45);stroke-width:2.5}
#tfbox .ghost{fill:none;stroke:rgba(169,214,204,.35);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
#tfbox .edge.dash{stroke-dasharray:5 4}
#tfbox .hit{fill:transparent;stroke:none;pointer-events:all;cursor:move}
#tfbox .penl{fill:none;stroke:#6fdcc0;stroke-width:1.5;vector-effect:non-scaling-stroke}
#tfbox .penp{fill:#0b0c0d;stroke:#6fdcc0;stroke-width:1.5;vector-effect:non-scaling-stroke}
.b-shp{background:#1d3150;border:1.5px solid #4f86c9}
.shp{position:absolute;left:0;top:0}
.shp svg{width:100%;height:100%;stroke-width:initial}
.monitor.shape,.monitor.shape .frame,.monitor.shape .tx,.monitor.shape .shp{cursor:crosshair}
.toolwrap{position:relative}
.toolwrap .tool i{position:absolute;right:3px;bottom:3px;width:0;height:0;border-left:4px solid transparent;border-bottom:4px solid currentColor;opacity:.7}
.flyout{position:absolute;left:0;bottom:36px;z-index:50;background:#1b1c1f;border:1px solid var(--line2);border-radius:9px;padding:4px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.flyout button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:6px;color:#d6d8db;font-size:13px}
.flyout button:hover,.flyout button.on{background:#2a2c30;color:#fff}
.flyout svg{width:16px;height:16px}
.flyout kbd{margin-left:auto;font:inherit;font-size:11px;color:var(--dim)}
#tfbox.locked .edge{stroke:rgba(169,214,204,.45);stroke-dasharray:2 3}
.acc-h .lock{color:var(--dim);width:28px;height:28px;display:grid;place-items:center;border-radius:6px;margin-left:2px}
.acc-h .lock:hover{color:var(--text);background:#23262a}
.acc-h .lock.on{color:#e6b95c}
.acc-h .lock svg{width:15px;height:15px}
.frame.cliphot{cursor:move}
/* Premiere-style transform panel */
.tf{display:grid;grid-template-columns:1fr auto auto auto 22px;align-items:center;row-gap:4px;column-gap:6px}
.tf .tl2{color:#c9cbce;font-size:13px;padding:7px 0}
.tf .val{display:flex;align-items:baseline;gap:4px;min-width:74px;justify-content:flex-end}
.tf .val em{font-style:normal;color:#b4b7bb;font-size:12.5px}
.scrub{color:#5aa2ff;font-variant-numeric:tabular-nums;cursor:ew-resize;border-bottom:1px dashed transparent;user-select:none;padding:1px 2px;border-radius:3px}
.scrub:hover{border-bottom-color:#5aa2ff}
.scrub.dim{color:#6b7078}
.scrub.dim:hover{border-bottom-color:transparent}
.scrubin{width:64px;background:#0b0c0d;border:1px solid #5aa2ff;border-radius:4px;color:#fff;padding:1px 4px;text-align:right;font:inherit;font-variant-numeric:tabular-nums;outline:none}
.kf{width:22px;height:22px;display:grid;place-items:center;color:#6b7078;border-radius:5px}
.kf:hover{color:#dfe1e3;background:#23262a}
.kf svg{width:11px;height:11px}
.kf.on{color:#5aa2ff}
.kf.on svg{fill:#5aa2ff}
.lnk{width:22px;height:22px;display:grid;place-items:center;color:#6b7078;border-radius:5px}
.lnk.on{color:#dfe1e3}
.lnk svg{width:14px;height:14px}
.fillfit{display:flex;gap:18px;margin:2px 0 8px}
.fillfit button{display:flex;align-items:center;gap:8px;color:#c9cbce;font-size:13px;padding:4px 6px;border-radius:6px}
.fillfit button:hover{background:#23262a;color:#fff}
.fillfit svg{width:20px;height:20px}
.acc-h .rst{color:var(--mute);width:28px;height:28px;display:grid;place-items:center;border-radius:6px}
.acc-h .rst:hover{color:var(--text);background:#23262a}
.frame video.hide{opacity:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12%;color:var(--mute);font-size:max(12px,3.4cqw);background:repeating-linear-gradient(135deg,#0d0e0f 0 12px,#101113 12px 24px)}
.empty b{display:block;color:var(--text);margin-bottom:6px}
.safe{position:absolute;inset:0;pointer-events:none;z-index:900}
.safe i{position:absolute;background:rgba(220,70,70,.16)}
.safe .t{left:0;right:0;top:0;height:14%}
.safe .bt{left:0;right:0;bottom:0;height:35%}
.safe .l{left:0;top:14%;bottom:35%;width:6%}
.safe .r{right:0;top:14%;bottom:35%;width:6%}
.safe span{position:absolute;left:7%;top:14.5%;font-size:max(9px,2.2cqw);letter-spacing:.06em;color:rgba(255,255,255,.55)}
.vctl{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--line2);border-radius:10px;background:rgba(18,19,21,.92);z-index:5}
.vctl .vb{width:30px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--mute)}
.vctl .vb:hover,.vctl .vz:hover{color:var(--text);background:#222428}
.vctl .vb.on{color:var(--acc2);background:var(--accBg)}
.vctl .vz{height:28px;padding:0 8px;border-radius:7px;color:#c9cbce;font-size:12px;font-variant-numeric:tabular-nums;min-width:48px}
.vctl .vsep{width:1px;height:18px;background:var(--line2);margin:0 3px}
.guide-v{z-index:1001;position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--acc2);opacity:0;pointer-events:none}
.guide-v.on{opacity:.8}

.hl{position:absolute;width:88%;transform:translate(-50%,-50%);text-align:center;cursor:grab;font:800 5.3cqw/1.42 Montserrat,Inter,system-ui,sans-serif;user-select:none;touch-action:none}
.hl:active{cursor:grabbing}
.hl span{padding:.1em .38em;border-radius:.3em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lk-white span{background:#fff;color:#0a0a0a}
.lk-purple span{background:#4a2a5e;color:#fff}
.lk-black span{background:#0c0c0c;color:#fff}
.lk-clean span{color:#fff;text-transform:uppercase;-webkit-text-stroke:.14em #000;paint-order:stroke fill;background:none}
.hl.sel{outline:1.5px dashed var(--acc2);outline-offset:8px;border-radius:4px}
.dsc{z-index:1000;position:absolute;left:6%;right:6%;text-align:center;color:rgba(255,255,255,.78);font-size:max(8px,2.3cqw);text-shadow:0 1px 2px rgba(0,0,0,.8);pointer-events:none}
.sub{position:absolute;left:7%;right:7%;top:62%;text-align:center;pointer-events:none;font:800 6cqw/1.25 Montserrat,Inter,sans-serif}
.sb-hormozi{text-transform:uppercase;color:#fff;-webkit-text-stroke:.12em #000;paint-order:stroke fill}
.sb-hormozi b{color:#ffe14a}
.sb-clean{text-transform:uppercase;color:#fff;-webkit-text-stroke:.14em #000;paint-order:stroke fill}
.sb-clean b,.sb-pill b,.sb-hug b,.sb-purple b,.sb-large b{font-weight:inherit}
.sb-pill span{background:rgba(20,20,22,.85);color:#fff;padding:.12em .45em;border-radius:.35em;font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sb-hug span{background:#fff;color:#000;padding:.08em .35em;border-radius:.25em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sb-purple{color:#d9b8ff;-webkit-text-stroke:.1em #1a1025;paint-order:stroke fill}
.sb-large span{background:#fff;color:#000;text-transform:uppercase;padding:.08em .35em;border-radius:.2em;box-decoration-break:clone;-webkit-box-decoration-break:clone}

.transport{display:flex;align-items:center;justify-content:center;gap:4px}
.transport .tb{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#c9cbce}
.transport .tb:hover{background:var(--panel2);color:#fff}
.transport .tb.play{width:36px;height:36px;margin:0 4px;border-radius:50%;background:var(--text);color:#000}
.transport .tb.play svg{fill:#000;stroke:#000}

/* timeline */
.splitter{position:absolute;left:0;right:0;top:-4px;height:8px;cursor:row-resize;z-index:20}
.tl{container-type:inline-size;container-name:tl}
.tlbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.tlL,.tlR{display:flex;align-items:center;gap:8px;min-width:0}
.tlL{overflow:hidden}
.tlR{justify-content:flex-end}
.tlL > *,.tlR > *,.zoom > *,.pvol > *{flex-shrink:0}
.pvol{display:flex;align-items:center;gap:2px;color:var(--mute)}
.pvol input{width:84px}
@container tl (max-width:1240px){ .tlL .tool .tlabel{display:none} .bigtc .dur{display:none} }
@container tl (max-width:1060px){ .pvol input{width:56px} .zoom input{width:80px} }
@container tl (max-width:900px){ .tlL [data-tool="hand"],.tlL .toolwrap{display:none} }
.bigtc{font-variant-numeric:tabular-nums;font-size:19px;color:var(--ph);font-weight:500;letter-spacing:.02em;white-space:nowrap;margin-right:6px}
.bigtc .dur{color:var(--dim);font-size:14px;margin-left:8px}
.tool:disabled{opacity:.35;pointer-events:none}
.tool{height:30px;min-width:30px;padding:0 8px;border-radius:7px;display:flex;align-items:center;gap:6px;color:var(--mute);border:1px solid transparent;font-size:12.5px}
.tool:hover{color:var(--text);background:var(--panel2)}
.tool.on{color:var(--acc2);border-color:#2d6b54;background:var(--accBg)}
.sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.tlbar .sp{flex:1}
.zoom{display:flex;align-items:center;gap:8px;color:var(--mute)}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:#2a2d31;outline-offset:6px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#101213;border:2px solid var(--acc);cursor:pointer}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#101213;border:2px solid var(--acc)}
.zoom input{width:120px}

.tlscroll{flex:1;overflow:auto;min-height:0;position:relative;overscroll-behavior:contain}
.tlinner{position:relative;min-width:100%;width:max-content;padding-bottom:10px}
.row{display:flex;align-items:stretch}
.row.ruler{position:sticky;top:0;z-index:6;height:30px;background:var(--panel)}
.th{position:sticky;left:0;z-index:5;width:var(--headw);flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:#121315;border-right:1px solid var(--line);border-bottom:1px solid #1a1c1f}
.ruler .th{z-index:7;border-bottom-color:var(--line);color:var(--dim);font-size:11px}
.th .tid{font-size:11px;font-weight:600;color:var(--mute);width:22px;height:20px;border-radius:5px;display:grid;place-items:center;background:#1d1f22}
.th .tname{flex:1;min-width:0;font-size:12px;color:#b9bcc0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th button{color:var(--dim);display:grid;place-items:center;width:22px;height:22px;border-radius:5px}
.th button:hover{color:var(--text);background:#23262a}
.th button svg{width:14px;height:14px}
.lane{position:relative;border-bottom:1px solid #1a1c1f;background:#0c0d0e}
.row.v .lane{background:#0e1011}
.row.afirst{border-top:1px solid rgba(82,183,136,.3)}
.row.a .lane{background:#0c0f0e}
.lane.drop-t{background:#12211b}
.cbt{width:26px!important;height:26px!important;border-radius:6px!important;color:var(--dim)!important;border:1px solid transparent}
.cbt:hover{color:var(--text)!important;background:#23262a}
.cbt.on{color:var(--acc2)!important;background:var(--accBg)!important;border-color:#2d6b54}
.cbt svg{width:15px!important;height:15px!important}
.ruler .th{gap:4px!important}
.hand .clip,.hand .aclip,.hand .bar,.hand .lane{cursor:grab!important}
.tlscroll.panning,.tlscroll.panning *{cursor:grabbing!important}
.clip .cl svg,.aclip .cl svg{width:10px;height:10px;vertical-align:-1px;margin-right:3px}
.aclip .cl{position:absolute;left:6px;top:3px;font-size:10.5px;color:#bfeee0;z-index:1;white-space:nowrap;text-shadow:0 1px 2px #000}
.ruler .lane{background:var(--panel);border-bottom:1px solid var(--line);cursor:ew-resize}
.tick{position:absolute;bottom:0;width:1px;height:5px;background:#3a3d42}
.tick.M{height:11px;background:#5b6066}
.tick span{position:absolute;left:4px;bottom:9px;font-size:10px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.work-area{position:absolute;left:0;top:3px;height:3px;background:#c9b43a;border-radius:2px;opacity:.85}

.clip,.aclip,.bar{position:absolute;top:4px;bottom:4px;border-radius:6px;overflow:hidden;cursor:pointer;touch-action:none}
.clip{background:#15352d;border:1.5px solid var(--c-video);cursor:grab}
.clip:active{cursor:grabbing}
.clip .strip{position:absolute;inset:0;display:flex;opacity:.9}
.clip .strip canvas{height:100%;flex:none}

function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }
function defaultTranscript(){ return texts().map(h=>h.text).join(' ') || 'Your caption here'; }
function fits(trackId, s, e, ignore){ return s >= -1e-6 && S.items.every(o => o.track!==trackId || ignore.has(o.id) || e <= o.start+1e-4 || s >= end(o)-1e-4); }

  const o = S.items.filter(x => x.track===it.track && x!==it);

function findSlot(trackId, want, l, ignore=new Set()){

  const c = []; S.items.forEach(o => { if (o.track===trackId && !ignore.has(o.id)) c.push(end(o), o.start-l); });
  const ok = c.filter(s => fits(trackId, s, s+l, ignore)).sort((a,b)=>Math.abs(a-want)-Math.abs(b-want));

function ensureTracks(){
  const used = id => S.items.some(i => i.track===id);
  for (const type of ['v','a']){
    let ts = typeList(type);
    while (ts.length > 1 && !used(ts[ts.length-1].id) && !used(ts[ts.length-2].id)){ S.tracks.splice(S.tracks.indexOf(ts[ts.length-1]),1); ts = typeList(type); }
    if (!ts.length || used(ts[ts.length-1].id)) S.tracks.push(mkTrack(type));

const subById = id => S.subs.find(x => x.id === id);
function activeSubItem(sub){ return S.items.filter(i => i.kind==='subtitle' && i.subId===sub.id && S.t>=i.start && S.t<end(i) && layerVisible(i)).pop(); }
function inspTarget(){ return S.section.startsWith('subs:') ? subById(S.section.slice(5)) : primaryItem(); }
const linkedOf = it => (S.linked && it.link) ? S.items.filter(x => x.link===it.link) : [it];

/* ---------- media ---------- */
function addMedia(src, name, noPlace){
  return new Promise(done => {
    const m = { id:'m'+(++uid), name, src, duration:0, thumbs:[], status:'loading' };
    S.media.push(m); renderNav();
    const v = document.createElement('video');
    v.preload='auto'; v.muted=true; v.playsInline=true; v.src=src;
    v.addEventListener('loadedmetadata', async () => {
      m.duration = r2(v.duration); m.w = v.videoWidth || 1080; m.h = v.videoHeight || 1920; m.status = 'ok';
      if (!noPlace && !S.items.some(isMedia)){ placeMedia(m.id, 0, typeList('v')[0].id); $('#fname').textContent = name; }
      renderAll(); done();
      await makeThumbs(m, v); renderTimeline(); renderNav();
    }, { once:true });
    v.addEventListener('error', () => { m.status='missing'; renderNav(); done(); }, { once:true });
  });
}
async function makeThumbs(m, v){
  const N = clamp(Math.round(m.duration*2), 8, 40);
  for (let i=0;i<N;i++){
    const t = (i+.5)/N*m.duration;
    await new Promise(res => { const to=setTimeout(res,1500); v.addEventListener('seeked',()=>{clearTimeout(to);res();},{once:true}); v.currentTime=t; });
    const c = document.createElement('canvas'); c.width=54; c.height=96;
    const x = c.getContext('2d'); const vw=v.videoWidth, vh=v.videoHeight;
    const s = Math.max(54/vw, 96/vh); x.drawImage(v, (54-vw*s)/2, (96-vh*s)/2, vw*s, vh*s);
    m.thumbs.push({ t, c });

}
function thumbAt(m, t){ if(!m||!m.thumbs.length) return null; let best=m.thumbs[0]; for(const th of m.thumbs){ if(Math.abs(th.t-t)<Math.abs(best.t-t)) best=th; } return best.c; }
function placeMedia(mid, at, vTrackId, aTrackId){
  const m = media(mid); if (!m || m.status!=='ok') return;
  ensureTracks();
  const l = m.duration, link = 'L'+(++uid), vts = typeList('v'), ats = typeList('a');
  let vt = vTrackId || vts[0].id, start = at==null ? S.total : Math.max(0, at);
  let s = findSlot(vt, start, l); if (s===null){ vt = vts[vts.length-1].id; s = start; }
  const aOrder = aTrackId ? [aTrackId, ...ats.map(t=>t.id).filter(id=>id!==aTrackId)] : ats.map(t=>t.id);
  const at2 = aOrder.find(id => fits(id, s, s+l, new Set())) || ats[ats.length-1].id;
  const v = { id:'i'+(++uid), kind:'video', track:vt, start:s, mediaId:mid, in:0, out:m.duration, speed:1, volume:1, link, on:true, tf:defaultTf(m), lsh:defaultLsh() };
  const a = { id:'i'+(++uid), kind:'audio', track:at2, start:s, mediaId:mid, in:0, out:m.duration, speed:1, volume:1, link, on:true };
  S.items.push(v, a); ensureTracks(); layout();
  S.sel = S.linked ? [v.id, a.id] : [v.id]; S.primary = v.id; S.section = 'clip';
  return v;
}

/* ---------- transform ---------- */
function lsz(m){ const f = Math.max(CW/m.w, CH/m.h); return { w:r2(m.w*f), h:r2(m.h*f) }; }
function layerSize(it){ return isBoxed(it) ? it.box : lsz(media(it.mediaId)); }
function fillScale(m, mode){ const d = lsz(m), a = CW/d.w, b = CH/d.h; return r2((mode==='fit' ? Math.min(a,b) : Math.max(a,b))*100); }
function defaultTf(m){ const d = lsz(m); return { px:CW/2, py:CH/2, ax:d.w/2, ay:d.h/2, sx:100, sy:100, rot:0, op:100, link:true, lock:false, keys:{} }; }
function l2c(tf, lx, ly){
  const r = tf.rot*Math.PI/180, dx = (lx-tf.ax)*tf.sx/100, dy = (ly-tf.ay)*tf.sy/100;
  return [tf.px + dx*Math.cos(r) - dy*Math.sin(r), tf.py + dx*Math.sin(r) + dy*Math.cos(r)];
}
function c2l(tf, cx, cy){
  const r = -tf.rot*Math.PI/180, dx = cx-tf.px, dy = cy-tf.py;
  const ux = dx*Math.cos(r) - dy*Math.sin(r), uy = dx*Math.sin(r) + dy*Math.cos(r);
  return [tf.ax + ux/(tf.sx/100), tf.ay + uy/(tf.sy/100)];
}
const kScale = () => frame.clientWidth / CW;
function layerCss(el, it){
  const d = layerSize(it), tf = it.tf, k = kScale(), L = it.lsh;
  Object.assign(el.style, { width:d.w*k+'px', height:d.h*k+'px', left:(tf.px-tf.ax)*k+'px', top:(tf.py-tf.ay)*k+'px',
    transformOrigin:`${tf.ax*k}px ${tf.ay*k}px`, transform:`rotate(${tf.rot}deg) scale(${tf.sx/100},${tf.sy/100})`, opacity:tf.op/100,
    filter: [it.blur && it.blur.on ? `blur(${(it.blur.amount*k).toFixed(2)}px)` : '', L && L.on ? `drop-shadow(${shadowOf(L, k)})` : ''].filter(Boolean).join(' ') || 'none' });
}
let lastLayerKey = '';
function applyLayer(){ if (!curV) return; const key = JSON.stringify([curV.id, curV.tf, curV.lsh, frame.clientWidth]); if (key===lastLayerKey) return; lastLayerKey = key; layerCss($('#clipLayer'), curV); }
/* resize a text box; fx/fy = fixed edge fraction (0 = left/top stays, 1 = right/bottom stays, null = grow around the anchor) */
function resizeBox(it, w2, h2, fx=null, fy=null){
  const tf = it.tf, b = it.box, w = b.w, h = b.h;
  w2 = Math.max(4, w2); h2 = Math.max(4, h2);
  const ax2 = tf.ax*w2/w, ay2 = tf.ay*h2/h;
  const dx = fx==null ? 0 : (fx*w - tf.ax) - (fx*w2 - ax2), dy = fy==null ? 0 : (fy*h - tf.ay) - (fy*h2 - ay2);
  const r = tf.rot*Math.PI/180, lx = dx*tf.sx/100, ly = dy*tf.sy/100;
  tf.px = r2(tf.px + lx*Math.cos(r) - ly*Math.sin(r)); tf.py = r2(tf.py + lx*Math.sin(r) + ly*Math.cos(r));
  tf.ax = r2(ax2); tf.ay = r2(ay2); b.w = r2(w2); b.h = r2(h2);

/* ---------- playback ---------- */
let curV = null, curVIdx = -1, loadingV = false;
const audioEls = new Map();
function topVideoAt(t){
  const vts = typeList('v');
  for (let i=vts.length-1;i>=0;i--){
    if (!vts[i].on) continue;
    const it = S.items.find(x => x.kind==='video' && !x.overlay && x.track===vts[i].id && t>=x.start-1e-6 && t<end(x)-1e-4);
    if (it) return { it, idx:i };
  }
  return null;
}
// one preloaded <video> per media: a cut swaps elements instead of reloading one element's src (that reload showed
// a black frame at every cut in the preview; the render never had it). The new element is shown only once it has
// the wanted frame; the previous one stays visible until then.
const vpool = new Map();
function poolVid(m){
  let el = vpool.get(m.id);
  if (!el){
    el = document.createElement('video'); el.playsInline = true; el.preload = 'auto'; el.muted = true; el.src = m.src;
    el.classList.add('hide'); $('#clipLayer').appendChild(el); vpool.set(m.id, el);
    // a failed load (server restarted, connection dropped) is dropped from the pool and created again next frame
    el.addEventListener('error', () => { if (vpool.get(m.id) === el){ vpool.delete(m.id); el.remove(); if (vid === el) vid = null; } });
  }
  return el;
}
function prerollNext(){
  // the next shot's element is created ~3 s before the cut and parked on its first frame, so the swap is instant
  if (!curV) return null;
  const e = end(curV), vts = typeList('v');
  const nx = S.items.filter(x => x.kind==='video' && !x.overlay && x.start >= e-1e-3 && x.start - S.t < 3 && vts.some(t => t.id===x.track && t.on))
                    .sort((a,b) => a.start-b.start)[0];
  if (!nx || nx.mediaId === curV.mediaId) return null;
  const el = poolVid(media(nx.mediaId));
  if (el.readyState >= 1 && el.paused && Math.abs(el.currentTime - nx.in) > 0.04) el.currentTime = nx.in;
  return nx.mediaId;
}
// At most the current and the next clip keep a <video>: with every clip of the project preloaded (8+ hardware
// decoders) the browser after a while stopped putting video on screen at all - the elements still decoded frames,
// the preview stayed black . Hidden elements of other clips are fully released.
function trimPool(keep){
  vpool.forEach((el, id) => {
    if (keep.has(id) || el === vid || !el.classList.contains('hide')) return;
    el.pause(); el.removeAttribute('src'); el.load(); el.remove(); vpool.delete(id);
  });
}
function syncVideo(force){
  const hit = topVideoAt(S.t); curV = hit ? hit.it : null; curVIdx = hit ? hit.idx : -1;
  if (!curV){ vpool.forEach(el => { if(!el.paused) el.pause(); el.classList.add('hide'); }); trimPool(new Set()); updateEmpty(); return; }
  applyLayer();
  const m = media(curV.mediaId), want = curV.in + (S.t-curV.start)*curV.speed;

    const prev = vid; vid = el; vid.style.zIndex = 2; if (prev) prev.style.zIndex = 1;
    // hide the previous element only when the new one really has a frame (polls; never shows black meanwhile)
    const show = (tries = 0) => { if (vid !== el) return;
      if ((el.readyState < 2 || el.seeking) && tries < 60) { setTimeout(() => show(tries + 1), 50); return; }
      el.classList.remove('hide');

    if (el.readyState >= 1){ el.playbackRate = curV.speed; if (Math.abs(el.currentTime - want) > 0.04) el.currentTime = want; }
    else { loadingV = true; el.addEventListener('loadedmetadata', () => { loadingV = false;
      if (curV && vid === el){ el.currentTime = curV.in+(S.t-curV.start)*curV.speed; el.playbackRate = curV.speed; } }, { once:true }); }
    show();

  // for a real jump. The old 0.3 s seek tolerance let lips run up to 0.3 s off the voice (review: '...')
  const drift = vid.currentTime - want;
  if (force ? Math.abs(drift) > 0.01 : Math.abs(drift) > 0.5){ vid.currentTime = want; vid.playbackRate = curV.speed; }
  else {
    const r = S.playing && Math.abs(drift) > 0.012 ? curV.speed * (1 - clamp(drift * 2.5, -0.25, 0.25)) : curV.speed;
    if (Math.abs(vid.playbackRate - r) > 0.003) vid.playbackRate = r;

// overlay layers (item.overlay, e.g. the karaoke subtitle track - a transparent VP9 video): drawn full-frame ABOVE the
// clip, never chosen as the "top clip"; render.py composites the same file (its .mov sibling) the same way
const ovEls = new Map();
// an overlay with a PNG-state index (karaoke subs): an <img> switched by time - pixel-identical to the render and
// independent of the browser's VP9-alpha support
const frameIdx = new Map();
function syncFrameOverlay(it, m, live){
  let F = frameIdx.get(m.id);
  if (!F){
    F = { list:null }; frameIdx.set(m.id, F);
    const base = m.frames.replace(/[^/]+$/, '');
    fetch(m.frames, { cache:'no-store' }).then(r => r.json()).then(list => {
      F.list = list.map(x => ({ t:x.t, src: x.f ? base + x.f : null }));
      F.list.forEach(x => { if (x.src) { const im = new Image(); im.src = x.src; } });   // preload every state
    }).catch(() => {});
  }
  let el = ovEls.get(it.id);
  if (!el){ el = document.createElement('img'); el.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none';
    el.alt = ''; el.pause = () => {}; $('#clipLayer').after(el); ovEls.set(it.id, el); }
  const u = it.in + (S.t - it.start) * it.speed;
  let src = null;
  if (F.list && S.t >= it.start && S.t < end(it)){
    let lo = 0, hi = F.list.length - 1;                 // last state with t <= u
    while (lo < hi){ const mid = (lo + hi + 1) >> 1; if (F.list[mid].t <= u + 1e-4) lo = mid; else hi = mid - 1; }
    src = F.list[lo].src;
  }

function syncOverlays(force){
  const live = new Set();

    const tr = trackById(it.track); if (!tr || !tr.on) continue;
    const om = media(it.mediaId);
    if (om && om.frames){ syncFrameOverlay(it, om, live); continue; }
    let el = ovEls.get(it.id);
    if (!el){ el = document.createElement('video'); el.playsInline = true; el.preload = 'auto'; el.muted = true;
      el.src = media(it.mediaId).src; el.style.zIndex = 5; el.style.pointerEvents = 'none'; el.classList.add('hide');
      $('#clipLayer').after(el); ovEls.set(it.id, el); }
    if (S.t < it.start || S.t >= end(it)) { el.classList.add('hide'); if (!el.paused) el.pause(); continue; }
    live.add(it.id);
    const want = it.in + (S.t - it.start) * it.speed;
    if (el.readyState >= 1 && Math.abs(el.currentTime - want) > (force ? 0.02 : 0.15)) el.currentTime = want;
    if (el.readyState >= 2) el.classList.remove('hide');

    if (!itemById(id)) { el.remove(); ovEls.delete(id); } });
}
// one <audio> per audio item, created ~2.5 s before the item starts and parked on its in-point: created at the cut it
// started 0.1-0.3 s late and stayed that late (the voice behind the lips)
function audioEl(it){
  let a = audioEls.get(it.id);
  if (a) return a;
  a = new Audio(); a.preload = 'auto'; a.src = media(it.mediaId).src; audioEls.set(it.id, a);
  a.addEventListener('error', () => { if (audioEls.get(it.id) === a) audioEls.delete(it.id); }, { once:true });
  a.addEventListener('loadedmetadata', () => { const x = itemById(it.id); if (!x) return;
    a.currentTime = S.t >= x.start ? x.in + (S.t - x.start) * x.speed : x.in; }, { once:true });
  return a;

// the timeline clock while sound plays: the position of the audio element that has been playing longest. Video

function masterClock(){

    const it = itemById(id); if (!it || a.paused || a.seeking || a.readyState < 3) return;
    const t = it.start + (a.currentTime - it.in) / it.speed;
    if (t < it.start - 0.05 || t >= end(it) || Math.abs(t - S.t) > 0.25) return;
    if (!best || it.start < best.start) best = { start: it.start, t, a };

}
let masterA = null;
function syncAudio(force){
  const active = new Set();
  if (S.playing){
    for (const it of S.items){
      if (it.kind!=='audio') continue;
      const tr = trackById(it.track); if (!tr || !tr.on) continue;
      if (S.t < it.start){
        if (it.start - S.t >= 2.5) continue;
        const a = audioEl(it), want = it.in - (it.start - S.t) * it.speed;           // preroll the next ones
        // the last 0.4 s it already runs, silent, from before its in-point: the browser's start latency (~80 ms) is
        // spent before the cut, so at the cut the sound is already in step (it was a hiccup at every cut)
        if (it.start - S.t < 0.4 && want >= 0 && a.readyState >= 1){
          active.add(it.id); a.volume = 0; a.playbackRate = it.speed;
          if (Math.abs(a.currentTime - want) > 0.12) a.currentTime = want;
          if (a.paused) a.play().catch(()=>{});
        }
        continue;
      }
      if (S.t >= end(it)) continue;
      active.add(it.id);
      const a = audioEl(it), want = it.in + (S.t-it.start)*it.speed;
      if (a.readyState < 1) continue;
      a.playbackRate = it.speed; a.volume = clamp(it.volume,0,1) * edgeGain(it) * (S.muted ? 0 : S.vol);

      if (Math.abs(a.currentTime-want) > (force ? 0.05 : a === masterA ? 0.3 : 0.12)) a.currentTime = want;
      if (a.paused) a.play().catch(()=>{});
    }
  }
  audioEls.forEach((a,id) => { if (!active.has(id) && !a.paused) a.pause(); if (!itemById(id)){ a.pause(); audioEls.delete(id); } });
}
// declick: an audio item with `fade` (s) ramps in/out at its edges, like the local render (afade)
function edgeGain(it){ const f = it.fade || 0; if (!f) return 1; const u = S.t - it.start, d = end(it) - it.start;
  return clamp(Math.min(u, d - u) / f, 0, 1); }
function seekTo(t){ S.t = clamp(t, 0, seqDur()); syncVideo(true); syncAudio(true); syncOverlays(true); }
function play(){ if (S.t >= seqDur()-0.02) S.t = 0; S.playing = true; last = performance.now(); syncVideo(true); syncAudio(true); syncOverlays(true); updatePlayBtn(); }
function pause(){ S.playing = false; if (vid) vid.pause(); ovEls.forEach(o => o.pause()); audioEls.forEach(a=>a.pause()); updatePlayBtn(); }

function updatePlayBtn(){ $('#playbtn').innerHTML = S.playing ? I.pause : I.play; }
let last = performance.now();
function tick(now){

/* ---------- editing ops ---------- */
function splitAt(t, it){
  const group = linkedOf(it).filter(x => t > x.start+0.05 && t < end(x)-0.05);
  if (!group.length) return;
  const newLink = 'L'+(++uid), created = [];
  group.forEach(x => {
    const x2 = clone(x); x2.id = 'i'+(++uid); x2.start = r2(t); x2.link = x.link ? newLink : null;
    if (isMedia(x)){ const local = x.in + (t-x.start)*x.speed; x.out = r2(local); x2.in = r2(local); }
    else { x2.dur = r2(end(x)-t); x.dur = r2(t-x.start); }
    S.items.push(x2); created.push(x2.id);
  });
  layout(); S.sel = created; S.primary = created[0]; S.section = sectionFor(itemById(created[0])); renderAll();
  toast(group.length>1 ? 'Cut video + audio' : 'Cut');
}
function deleteSelected(){
  if (!S.sel.length) return;
  const n = S.sel.length;
  S.items = S.items.filter(i => !S.sel.includes(i.id));
  S.sel = []; S.primary = null;
  if (S.section.startsWith('text:') || S.section.startsWith('shape:') || S.section==='clip') S.section = 'comp';
  ensureTracks(); layout(); seekTo(Math.min(S.t, seqDur())); renderAll(); toast(n>1 ? `Deleted ${n} items` : 'Deleted');
}
function createText(){

      mediaOut.push({ id:m.id, src:m.src, name:m.name, w:m.w, h:m.h });
    }
    const layers = full ? await rasterLayers(lbl) : [];
    const job = { ...buildJob(name, !full, mediaOut, layers), cleanName, task: S.task.name, drive };
    const s = await renderOne(job, p, lbl, drive);
    toast(`Rendered · exports/${s.dir}/${s.files.join(' + ')}${drive ? ' · copied to Drive / Upload' : ''}`);
  } catch (e) { toast('Render failed: ' + e.message); }
  finally { exporting = false; p.style.width = '0'; $('#expwrap').classList.remove('busy'); renderAll(); }
}
$('#expbtn').addEventListener('click', () => doExport(false));
$('#drvbtn').addEventListener('click', () => doExport(true));

/* ---------- toolbar, keys, misc ---------- */
function setTool(t){ if (editingId) stopEdit(); if (t!=='shape' && S.pen){ S.pen=null; S.penHover=null; } S.tool = t; monitor.classList.toggle('shape', t==='shape'); updShapeBtn(); document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on', b.dataset.tool===t)); monitor.classList.toggle('hand', t==='hand'); svgKey=''; renderTimeline(); }
function toggleSnap(){ S.snap=!S.snap; renderTimeline(); toast(S.snap?'Snap on':'Snap off'); }
function toggleLinked(){ S.linked=!S.linked; const p=primaryItem(); if(p){ S.sel = S.linked ? [...new Set(S.sel.flatMap(id=>linkedOf(itemById(id)).map(x=>x.id)))] : [p.id]; } renderAll(); toast(S.linked?'Linked selection on':'Linked selection off'); }
document.addEventListener('click', e => {
  const fs = e.target.closest('[data-shape]'); if (fs){ S.shapeKind = fs.dataset.shape; $('#flyout').hidden = true; setTool('shape'); return; }
  if (!e.target.closest('.flyout')) $('#flyout').hidden = true;
  const tool = e.target.closest('[data-tool]'); if (tool){ if (flyoutJust){ flyoutJust=false; return; } setTool(tool.dataset.tool); return; }
  const a = e.target.closest('.tlbar [data-act], .top [data-act], .th [data-act]'); if (!a) return;
  switch(a.dataset.act){
    case 'play': togglePlay(); break;
    case 'toStart': seekTo(0); tlscroll.scrollLeft=0; break;
    case 'toEnd': seekTo(S.total); break;
    case 'stepBack': pause(); seekTo(S.t-1/FPS); break;
    case 'stepFwd': pause(); seekTo(S.t+1/FPS); break;
    case 'delete': deleteSelected(); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'newText': setTool('select'); createText(); break;
    case 'snap': toggleSnap(); break;
    case 'linked': toggleLinked(); break;
    case 'zoomIn': setZoom(S.pps*1.25); break;
    case 'zoomOut': setZoom(S.pps/1.25); break;
    case 'fit': fit(); break;
    case 'mute': S.muted = !S.muted; updVol(); break;
    case 'download': toast('Download starts in the real app'); break;
    case 'trk': { const tr=trackById(a.dataset.id); tr.on=!tr.on; seekTo(S.t); renderAll(); break; }
  }
});
let flyoutJust = false, flyTimer = null;
function updShapeBtn(){ $('#shapebtn').innerHTML = ({rect:I.rectI, ellipse:I.ellI, pen:I.penI})[S.shapeKind] + '<i></i>'; document.querySelectorAll('#flyout [data-shape]').forEach(b=>b.classList.toggle('on', b.dataset.shape===S.shapeKind)); }
$('#shapebtn').addEventListener('pointerdown', () => { flyTimer = setTimeout(() => { $('#flyout').hidden = false; flyoutJust = true; }, 350); });
$('#shapebtn').addEventListener('pointerup', () => clearTimeout(flyTimer));
$('#shapebtn').addEventListener('contextmenu', e => { e.preventDefault(); $('#flyout').hidden = false; });
/* ---------- copy / cut / paste on the timeline ---------- */
let CLIPB = null;
function copySel(cutIt){
  const its = S.sel.map(itemById).filter(Boolean); if (!its.length) return;
  CLIPB = { t0: Math.min(...its.map(i=>i.start)), items: clone(its) };
  if (cutIt){ deleteSelected(); toast(`Cut ${its.length} item${its.length>1?'s':''}`); } else toast(`Copied ${its.length} item${its.length>1?'s':''}`);
}
function pasteClip(){
  if (!CLIPB) { toast('Nothing to paste'); return; }
  const lmap = {}, created = [];
  for (const src of CLIPB.items){
    const x = clone(src); x.id = 'i'+(++uid); x.start = r2(S.t + src.start - CLIPB.t0);
    if (x.link){ lmap[x.link] = lmap[x.link] || 'L'+(++uid); x.link = lmap[x.link]; }
    if (!trackById(x.track)) x.track = typeList(zoneOf(x))[0].id;
    S.items.push(x); created.push(x);
  }
  const n = overwrite(created); ensureTracks(); layout();
  S.sel = created.map(x=>x.id); S.primary = created[0].id; S.section = sectionFor(created[0]);
  seekTo(S.t); renderAll(); toast(`Pasted ${created.length} item${created.length>1?'s':''} at the playhead${n?' (overwrote '+n+')':''}`);
}
/* ---------- keyboard nudging of selected clips ---------- */
const selItems = () => S.sel.map(itemById).filter(Boolean);
function commitMove(group, msg){ const n = overwrite(group); ensureTracks(); layout(); seekTo(S.t); renderAll(); toast(msg + (n ? ` · overwrote ${n}` : '')); }
function nudgeSel(frames){
  const g = selItems(); if (!g.length){ toast('Select a clip first'); return; }
  let dt = frames/FPS; const min = Math.min(...g.map(x=>x.start)); if (min + dt < 0) dt = -min; if (!dt) return;
  g.forEach(x => x.start = r2(x.start + dt));
  commitMove(g, `Moved ${frames>0?'+':''}${frames} frame${Math.abs(frames)>1?'s':''}`);
}
function shiftSelTrack(dir){                    // dir = +1 visually up, -1 down
  const g = selItems(); if (!g.length){ toast('Select a clip first'); return; }
  const plan = [];
  for (const x of g){
    const tr = trackById(x.track), list = typeList(tr.type);
    const ni = idxInType(tr) + (tr.type==='v' ? dir : -dir);
    if (ni < 0 || ni >= list.length){ toast('No layer there'); return; }
    plan.push([x, list[ni].id]);
  }
  plan.forEach(([x, id]) => x.track = id);
  commitMove(g, dir>0 ? 'Moved up a layer' : 'Moved down a layer');
}
// timeline zoom = px per second, logarithmic slider. Leftmost = the whole video in view (or 10 px/s for very long
// ones - twice denser than the old minimum). While dragging, the drawn clips are only moved/resized; thumbnails and
// waveforms are redrawn once the zoom settles (the full redraw on every step made the slider lag)
const ZOOM_MAX = 260;
function zoomMin(){ const fitP = (tlscroll.clientWidth - HEAD_W - 40) / Math.max(seqDur(), 1); return clamp(Math.max(10, fitP), 1, ZOOM_MAX); }
function zoomToSlider(p){ const lo = zoomMin(); return lo >= ZOOM_MAX ? 0 : Math.round(1000 * Math.log(p/lo) / Math.log(ZOOM_MAX/lo)); }
function sliderToZoom(v){ const lo = zoomMin(); return lo * Math.pow(ZOOM_MAX/lo, v/1000); }
let zoomRAF = 0, zoomFull = 0, zoomWant = null;
function setZoom(p){
  zoomWant = clamp(p, zoomMin(), ZOOM_MAX);
  if (!zoomRAF) zoomRAF = requestAnimationFrame(() => { zoomRAF = 0; applyZoom(zoomWant, false); });
  clearTimeout(zoomFull); zoomFull = setTimeout(() => { if (zoomRAF){ cancelAnimationFrame(zoomRAF); zoomRAF = 0; } applyZoom(zoomWant, true); }, 180);
}
function applyZoom(p, full){
  const anchor = S.t, sx = HEAD_W + anchor*S.pps - tlscroll.scrollLeft;
  S.pps = p; if (document.activeElement !== $('#zoom')) $('#zoom').value = zoomToSlider(p);
  if (full) renderTimeline(); else quickTimeline();
  tlscroll.scrollLeft = HEAD_W + anchor*S.pps - sx;
}
function quickTimeline(){
  const W = laneWidth(), pps = S.pps;
  tlinner.querySelectorAll('.lane').forEach(l => l.style.width = W+'px');
  const rl = tlinner.querySelector('.ruler .lane'); if (rl) rl.innerHTML = rulerHTML(W) + `<div class="work-area" style="width:${S.total*pps}px"></div>`;
  tlinner.querySelectorAll('.lane [data-id]').forEach(el => { const it = itemById(el.dataset.id); if (!it) return;
    const w = Math.max(4, len(it)*pps); el.style.left = it.start*pps+'px'; el.style.width = w+'px';
    const cv = el.querySelector(':scope > canvas'); if (cv) cv.style.width = w+'px'; });
  updatePlayhead();
}
function fit(){ setZoom(zoomMin()); tlscroll.scrollLeft = 0; }
$('#zoom').addEventListener('input', e => setZoom(sliderToZoom(+e.target.value)));
function updVol(){ const b = $('#mutebtn'); if (b) b.innerHTML = (S.muted || !S.vol) ? I.mute : I.vol;
  const r = $('#pvol'); if (r && document.activeElement !== r) r.value = Math.round(S.vol*100); syncAudio(true); }
$('#pvol').addEventListener('input', e => { S.vol = +e.target.value/100; S.muted = false;
  try { localStorage.setItem('editor.vol', String(S.vol)); } catch (err) {} updVol(); });
updVol();
tlscroll.addEventListener('wheel', e => { if (e.ctrlKey||e.metaKey){ e.preventDefault(); setZoom(S.pps * (e.deltaY<0?1.1:1/1.1)); } }, { passive:false });
tlscroll.addEventListener('mousedown', e => { if (e.button===1) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select') || e.target.isContentEditable) return;
  const k = e.key, mod = e.metaKey||e.ctrlKey;
  if (mod && k.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if (mod && k.toLowerCase()==='c'){ e.preventDefault(); copySel(false); return; }
  if (mod && k.toLowerCase()==='x'){ e.preventDefault(); copySel(true); return; }
  if (mod && k.toLowerCase()==='v'){ e.preventDefault(); pasteClip(); return; }
  if (mod && (k==='ArrowLeft' || k==='ArrowRight')){ e.preventDefault(); nudgeSel((k==='ArrowLeft'?-1:1)*(e.shiftKey?10:1)); return; }
  if (mod && (k==='ArrowUp' || k==='ArrowDown')){ e.preventDefault(); shiftSelTrack(k==='ArrowUp'?1:-1); return; }
  if (mod) return;
  if (k===' '){ e.preventDefault(); togglePlay(); }
  else if (k==='v'||k==='V') setTool('select');
  else if (k==='c'||k==='C') setTool('razor');
  else if (k==='h'||k==='H') setTool('hand');
  else if (k==='t'||k==='T'){ e.preventDefault(); setTool('select'); createText(); }
  else if (k==='u'||k==='U'){ if (S.shapeKind==='pen') S.shapeKind='rect'; setTool('shape'); }
  else if (k==='p'||k==='P'){ S.shapeKind='pen'; setTool('shape'); }
  else if (k==='Escape' && S.pen){ S.pen=null; S.penHover=null; svgKey=''; }
  else if (k==='Enter' && S.pen){ finishPen(false); }
  else if (k==='s'||k==='S') toggleSnap();
  else if (k==='l'||k==='L') toggleLinked();
  else if (k==='Enter'){ const p = primaryItem(); if (p && p.kind==='text'){ e.preventDefault(); startEdit(p); } }
  else if (k==='Delete'||k==='Backspace') deleteSelected();
  else if (k==='ArrowLeft'){ e.preventDefault(); pause(); seekTo(S.t-(e.shiftKey?10:1)/FPS); }
  else if (k==='ArrowRight'){ e.preventDefault(); pause(); seekTo(S.t+(e.shiftKey?10:1)/FPS); }
  else if (k==='Home') seekTo(0);
  else if (k==='End') seekTo(S.total);
  else if (k==='='||k==='+') setZoom(S.pps*1.25);
  else if (k==='-') setZoom(S.pps/1.25);
  else if (k==='\\') fit();
  else if (k===')'||(e.shiftKey&&k==='0')) fitView();
});
$('#filein').addEventListener('change', e => { [...e.target.files].forEach(f=>addMedia(URL.createObjectURL(f), f.name)); e.target.value=''; S.mediaOpen=true; });
window.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => { if (!e.dataTransfer.files.length) return; e.preventDefault(); S.mediaOpen=true; [...e.dataTransfer.files].filter(f=>f.type.startsWith('video')).forEach(f=>addMedia(URL.createObjectURL(f), f.name)); });
$('#splitter').addEventListener('pointerdown', e => {
  e.preventDefault(); const y0=e.clientY, h0=$('#tl').offsetHeight, w=$('#work');
  dragWin(ev => { w.style.setProperty('--tlh', clamp(h0-(ev.clientY-y0), 180, window.innerHeight-260)+'px'); updatePlayhead(); }, () => { renderOverlays(); lastLayerKey=''; svgKey=''; });
});
window.addEventListener('resize', () => { renderTimeline(); renderOverlays(); lastLayerKey=''; svgKey=''; });

/* ---------- preview zoom / pan ---------- */
function applyView(){ const v = S.view; frame.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.z})`; $('#vzlbl').textContent = Math.round(v.z*100)+'%'; svgKey=''; }
function zoomView(z2, cx, cy){
  const v = S.view, r = monitor.getBoundingClientRect(); z2 = clamp(z2, 0.25, 4);
  const mx = (cx ?? r.left+r.width/2) - (r.left+r.width/2), my = (cy ?? r.top+r.height/2) - (r.top+r.height/2);
  v.x = mx - (mx - v.x)*(z2/v.z); v.y = my - (my - v.y)*(z2/v.z); v.z = z2; applyView();
}
function fitView(){ S.view = { z:1, x:0, y:0 }; applyView(); }
document.querySelector('.vctl').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; const v = b.dataset.v; if (v==='in') zoomView(S.view.z*1.25); else if (v==='out') zoomView(S.view.z/1.25); else if (v==='100') zoomView(1); else fitView(); });
monitor.addEventListener('wheel', e => { e.preventDefault(); zoomView(S.view.z * Math.exp(-e.deltaY*0.0015), e.clientX, e.clientY); }, { passive:false });
monitor.addEventListener('mousedown', e => { if (e.button===1) e.preventDefault(); });
monitor.addEventListener('pointerdown', e => {
  if (e.target.closest('.vctl')) return;
  if (!(e.button===1 || (S.tool==='hand' && e.button===0))) return;
  e.preventDefault(); monitor.classList.add('panning');
  const x0=e.clientX, y0=e.clientY, vx=S.view.x, vy=S.view.y;
  dragWin(ev => { S.view.x = vx + ev.clientX-x0; S.view.y = vy + ev.clientY-y0; applyView(); }, () => monitor.classList.remove('panning'));
});
monitor.addEventListener('dblclick', () => { if (S.tool==='hand') fitView(); });

/* ---------- undo / redo ---------- */
const HIST = { stack:[], i:-1 };
function snapshot(){ return JSON.stringify({ tracks:S.tracks, items:S.items, disclaimer:S.disclaimer, subs:S.subs, subsOn:S.subsOn, customSubPresets:S.customSubPresets, customPresets:S.customPresets }); }
function checkpoint(){
  if (editingId) return;
  const sn = snapshot(); if (HIST.stack[HIST.i] === sn) return;
  HIST.stack = HIST.stack.slice(0, HIST.i+1); HIST.stack.push(sn);
  if (HIST.stack.length > 150) HIST.stack.shift();
  HIST.i = HIST.stack.length-1; updUndo();
}
function restore(sn){
  Object.assign(S, JSON.parse(sn)); layout();
  S.sel = S.sel.filter(itemById); if (!itemById(S.primary)) S.primary = S.sel[0] || null;
  if (S.section.startsWith('text:') && !itemById(S.section.slice(5))) S.section='comp';
  lastLayerKey=''; svgKey=''; seekTo(S.t); renderAll(); updUndo();
}
function undo(){ if (HIST.i>0){ HIST.i--; restore(HIST.stack[HIST.i]); toast('Undo'); } }
function redo(){ if (HIST.i<HIST.stack.length-1){ HIST.i++; restore(HIST.stack[HIST.i]); toast('Redo'); } }
function updUndo(){ $('#undobtn').disabled = HIST.i<=0; $('#redobtn').disabled = HIST.i>=HIST.stack.length-1; }

/* ---------- boot ---------- */
function renderAll(){ renderNav(); renderInspector(); renderTimeline(); renderOverlays(); renderExport(); updateEmpty(); svgKey=''; checkpoint(); }
updatePlayBtn(); updShapeBtn();
document.querySelector('.vctl [data-v="out"]').innerHTML = I.minus; document.querySelector('.vctl [data-v="in"]').innerHTML = I.plus; applyView();
ensureTracks(); layout();
/* ?project=projects/<id>.json - a timeline assembled by podcast/pod.py (or tools/pov_editor.py - text items too):
   { name, media:[{id,src,name}], tracks:{v,a}, items:[{kind,track,media,start,in,out,volume?,link?}] } */
async function loadProject(url){
  const P = await (await fetch(url, { cache:'no-store' })).json();
  S.items = []; S.media = []; S.sel = []; S.primary = null;
  const tv = Array.from({length:P.tracks.v||1}, () => mkTrack('v')), ta = Array.from({length:P.tracks.a||1}, () => mkTrack('a'));
  S.tracks = [...tv, ...ta];
  const ids = {};
  await Promise.all(P.media.map(async f => { await addMedia(f.src, f.name, true); const mm = S.media.find(m => m.src===f.src); ids[f.id] = mm.id; if (f.frames) mm.frames = f.frames; }));
  S.subs = []; S.subsOn = false;
  for (const ps of (P.subs || [])){
    const sub = newSub(), pre = ps.preset || 'karaoke';
    Object.assign(sub, { name: ps.name || sub.name, preset: pre, st: subPresetStyle(pre), words: ps.words, punct: ps.punct || ps.words.map(() => ''),
                         times: ps.times || null });
    if (ps.st) mergeDeep(sub.st, ps.st); if (ps.box) sub.box = ps.box; if (ps.tf) Object.assign(sub.tf, ps.tf); if (sub.lsh) sub.lsh.on = false;
    S.subs.push(sub); S.subsOn = true;
    S.items.push({ id:'i'+(++uid), kind:'subtitle', subId:sub.id, track: tv[Math.min(ps.track ?? tv.length-1, tv.length-1)].id,
                   start: ps.start || 0, dur: ps.dur, on:true });
  }
  for (const it of P.items){
    if (it.kind==='text'){   // editable caption layer: {kind:'text', track?, start, dur, text, px, py, w, h, preset?, st?}
      const st = mergeDeep(presetStyle(it.preset || 'white'), it.st || {});
      const ti = newTextItem(tv[Math.min(it.track ?? tv.length-1, tv.length-1)].id, it.start, it.dur, it.text, it.px, it.py, it.w, it.h, st);
      if (it.tf) Object.assign(ti.tf, it.tf);   // e.g. {sx, sy} - the user's caption scale from a previous variant
      S.items.push(ti);
      continue;
    }
    const m = media(ids[it.media]); if (!m || m.status!=='ok') continue;
    const x = { id:'i'+(++uid), kind:it.kind, track:(it.kind==='video'?tv:ta)[it.track].id, start:it.start, mediaId:m.id,
                in:it.in, out:Math.min(it.out, m.duration), speed:1, volume:it.volume ?? 1, fade:it.fade || 0, link:it.link || null, on:true,
                overlay: !!it.overlay };
    if (it.kind==='video'){ x.tf = defaultTf(m); x.lsh = defaultLsh(); }
    S.items.push(x);
  }
  ensureTracks(); layout(); $('#fname').textContent = P.name; S.task.name = P.name; $('#taskname').value = P.name;
  seekTo(0); renderAll(); fit(); HIST.stack=[]; HIST.i=-1; checkpoint(); toast(`Loaded ${P.name}`);   // opens zoomed to the whole video
}
const PROJECT = new URLSearchParams(location.search).get('project');
(async () => {
  if (PROJECT) return loadProject(PROJECT).catch(e => toast('Project load failed: '+e.message));
  for (const f of MEDIA_FILES) await addMedia(f.src, f.name); fit(); HIST.stack=[]; HIST.i=-1; checkpoint();
})();
renderAll();
document.fonts && document.fonts.ready.then(() => renderOverlays());
requestAnimationFrame(tick);
loadLocalFonts();
</script>
</body>
