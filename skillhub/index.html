<title>Power Tools Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Geist:wght@400..700&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500..800&family=Manrope:wght@500..800&family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700;900&family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: sticky bar -> filter row -> grid of vertical example posters (4:5) -> right-hand detail sheet with tabs;
   add-skill modal runs the format check the moment a skill is dropped. Palette = Kaleido's own tokens. */
:root{
  --bg:#070b09; --surface:#0e1411; --raised:#121a15; --sunken:#0c110e; --chip:#18211c; --chip-hover:#1f2a24;
  --line:#263129; --line-soft:#1d2622;
  --fg:#f2f7f4; --muted:#8fa096; --subtle:#7e8c84;
  --accent:#10b981; --accent-fg:#052e1f; --accent-ink:#34d399; --accent-soft:rgba(16,185,129,.13); --ring:#2dd4bf;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  --ok-soft:rgba(52,211,153,.12); --warn-soft:rgba(251,191,36,.12); --bad-soft:rgba(248,113,113,.12); --info-soft:rgba(96,165,250,.12);
  --scrim:rgba(2,5,4,.7); --shadow:0 24px 64px rgba(0,0,0,.55); --veil:rgba(7,11,9,.78);
  --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --r:10px; --r-lg:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#fbfdfb; --surface:#f3f7f4; --raised:#eef4f0; --sunken:#f7faf8; --chip:#e8efea; --chip-hover:#dfe8e2;
    --line:#d5e0d9; --line-soft:#e4ece7;
    --fg:#10201a; --muted:#5f6e66; --subtle:#66746c;
    --accent:#047857; --accent-fg:#ffffff; --accent-ink:#065f46; --accent-soft:rgba(4,120,87,.10); --ring:#0d9488;
    --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#1d4ed8;
    --ok-soft:rgba(21,128,61,.10); --warn-soft:rgba(180,83,9,.10); --bad-soft:rgba(185,28,28,.08); --info-soft:rgba(29,78,216,.08);
    --scrim:rgba(16,32,26,.38); --shadow:0 24px 64px rgba(16,32,26,.18); --veil:rgba(251,253,251,.82);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#fbfdfb; --surface:#f3f7f4; --raised:#eef4f0; --sunken:#f7faf8; --chip:#e8efea; --chip-hover:#dfe8e2;
  --line:#d5e0d9; --line-soft:#e4ece7;
  --fg:#10201a; --muted:#5f6e66; --subtle:#66746c;
  --accent:#047857; --accent-fg:#ffffff; --accent-ink:#065f46; --accent-soft:rgba(4,120,87,.10); --ring:#0d9488;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#1d4ed8;
  --ok-soft:rgba(21,128,61,.10); --warn-soft:rgba(180,83,9,.10); --bad-soft:rgba(185,28,28,.08); --info-soft:rgba(29,78,216,.08);
  --scrim:rgba(16,32,26,.38); --shadow:0 24px 64px rgba(16,32,26,.18); --veil:rgba(251,253,251,.82);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}
a{color:var(--accent-ink)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.ico svg{width:100%;height:100%;display:block}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--veil);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.top .wrap{display:flex;align-items:center;gap:12px 16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-ink);flex:none}
.mark svg{width:18px;height:18px}
.brand-t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-t b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand-t small{color:var(--subtle);font-size:12px}
.search{position:relative;flex:1 1 240px;max-width:420px}
.search .ico{position:absolute;left:11px;top:10px;color:var(--subtle)}
.search input{width:100%;height:36px;padding:0 12px 0 34px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.search input::placeholder{color:var(--subtle)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--chip)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--fg)}
.btn-danger{color:var(--bad)}
.btn-danger-solid{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.btn-sm{height:30px;padding:0 10px;font-size:13px;gap:6px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.iconbtn{width:34px;padding:0}

/* filters */
.intro{color:var(--muted);font-size:13px;padding-top:16px;max-width:80ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:14px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-soft);background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px}
.chip:hover{color:var(--fg);border-color:var(--line)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chip .n{font-family:var(--font-mono);font-size:11px;color:var(--subtle);font-variant-numeric:tabular-nums}
.sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
.sort{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--subtle);font-size:13px}
select{height:30px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:0 8px}
.summary{color:var(--subtle);font-size:13px;padding-bottom:14px;font-variant-numeric:tabular-nums}
.summary button{all:unset;cursor:pointer;color:var(--bad);text-decoration:underline;text-underline-offset:3px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--info-soft);color:var(--fg);font-size:13px;margin-bottom:14px}
.notice .ico{color:var(--info);margin-top:2px}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px;padding-bottom:56px}
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.media{position:relative;display:block;aspect-ratio:4/5;max-width:100%;background:var(--sunken);overflow:hidden}
.cname,.csum{display:block}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:14px;background:repeating-linear-gradient(135deg,transparent 0 11px,var(--line-soft) 11px 12px)}
.ph-name{display:block;font-family:var(--font-mono);font-size:19px;line-height:1.15;color:var(--muted);overflow-wrap:anywhere;font-weight:500}
.ph-label{font-size:12px;color:var(--subtle);display:flex;align-items:center;gap:6px}
.ov{position:absolute;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--veil);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:12px;font-weight:500;color:var(--fg)}
.ov.st{top:10px;left:10px}
.ov.dur{bottom:10px;right:10px;font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--subtle);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.cbody{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px;flex:1;min-width:0}
.cname{font-family:var(--font-mono);font-weight:500;font-size:14px;overflow-wrap:anywhere}
.slash{color:var(--accent-ink)}
.csum{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--muted);font-size:12px;line-height:1.3}
.tag.mono{font-family:var(--font-mono);font-size:11.5px}
.tag.paid{color:var(--warn)}
.tag.paid::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.tag.quote{color:var(--fg);background:var(--raised);border:1px solid var(--line-soft)}
.tag.accent{background:var(--accent-soft);color:var(--accent-ink)}
.tag.warnt{background:var(--warn-soft);color:var(--warn)}
.cfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--subtle);padding-top:2px}
.who{display:inline-flex;align-items:center;gap:6px;min-width:0}
.who img{width:18px;height:18px;border-radius:50%;flex:none;background:var(--chip)}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .repo{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--subtle);flex:none}
.who .repo svg{width:11px;height:11px}
.ver{font-family:var(--font-mono);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.skel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden}
.skel .media{background:var(--raised)}
.skel .bar{height:10px;border-radius:5px;background:var(--raised);margin:14px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:40px 28px;border:1.5px dashed var(--line);border-radius:var(--r-lg);background:var(--sunken);max-width:720px;margin-bottom:56px}
.empty h2{margin:0;font-size:18px;font-weight:600}
.empty p{margin:0;color:var(--muted);max-width:60ch}

/* pills / badges */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.compat{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.compat .ico{width:13px;height:13px}
.compat.y .ico{color:var(--ok)} .compat.n{color:var(--bad);border-color:var(--bad)} .compat.n .ico{color:var(--bad)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;justify-content:flex-end}
.sheet{width:min(1140px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:16px 20px 14px;border-bottom:1px solid var(--line-soft)}
.sheet-head .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.sheet-head h2{margin:0;font-family:var(--font-mono);font-size:20px;font-weight:500;overflow-wrap:anywhere;letter-spacing:-.01em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sheet-scroll{flex:1;overflow:auto;overscroll-behavior:contain}
.sheet-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;padding:20px 20px 40px}
.player{position:sticky;top:20px;display:flex;flex-direction:column;gap:10px;align-self:start}
.player video{width:100%;max-height:70vh;border-radius:var(--r-lg);background:var(--sunken);display:block}
.player .ph-box{position:relative;aspect-ratio:9/16;max-height:70vh;max-width:100%;border-radius:var(--r-lg);overflow:hidden;background:var(--sunken)}
.vmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--subtle);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:4px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:var(--r);background:var(--bad-soft);font-size:13px;width:100%}
.confirm span{margin-right:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-soft);overflow-x:auto;scrollbar-width:none;margin-top:12px}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;padding:10px 12px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--fg)}
.tab:focus-visible{outline:2px solid var(--ring);outline-offset:-2px;border-radius:6px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--font-mono);font-size:11px;padding:0 6px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tab .cnt.bad{background:var(--bad-soft);color:var(--bad)} .tab .cnt.warn{background:var(--warn-soft);color:var(--warn)}
.pane{padding-top:6px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px;padding-block:16px;border-bottom:1px solid var(--line-soft);min-width:0}
.sec:last-child{border-bottom:0}
.sec h4{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);font-weight:600}
.desc{margin:0;font-size:15px;line-height:1.6;max-width:70ch;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 16px;margin:0}
.facts dt{color:var(--subtle);font-size:13px;padding-top:2px}
.facts dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0;font-size:13px;align-items:center}
.outline{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;counter-reset:o}
.outline button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:8px;width:100%;box-sizing:border-box;font-size:13.5px}
.outline button:hover{background:var(--surface)}
.outline button:focus-visible{outline:2px solid var(--ring)}
.outline .lv3{padding-left:28px;color:var(--muted);font-size:13px}
.outline .n{font-family:var(--font-mono);font-size:11px;color:var(--subtle);min-width:18px;font-variant-numeric:tabular-nums}

/* claude breakdown */
.ai{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line-soft);margin-block:16px}
.ai-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ai-head h4{margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;margin-right:auto}
.ai-head h4 .ico{color:var(--accent-ink)}
.ai p{margin:0;max-width:70ch}
.ai .lead{font-size:15px;line-height:1.55}
.ai-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.ai-grid h5{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);font-weight:600}
.ai-grid ul,.ai-grid ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.ai-grid ol li::marker{font-family:var(--font-mono);color:var(--subtle)}
.ai .stale{font-size:12px;color:var(--warn)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* report */
.report{display:flex;flex-direction:column;gap:10px}
.report-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fixbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);font-size:13px}
.fixbar span{margin-right:auto}
.fixed{padding:10px 12px;border-radius:var(--r);background:var(--ok-soft);font-size:13px}
.fixed ul{margin:4px 0 0;padding-left:18px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.check{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--surface);align-items:start}
.check .ico{margin-top:2px}
.check.error .ico{color:var(--bad)} .check.warn .ico{color:var(--warn)} .check.info .ico{color:var(--info)} .check.pass .ico{color:var(--ok)}
.check .t{font-weight:500;overflow-wrap:anywhere}
.check .d{color:var(--muted);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.check .d code{font-family:var(--font-mono);font-size:12px;background:var(--chip);padding:1px 5px;border-radius:4px}
.target{font-family:var(--font-mono);font-size:10.5px;color:var(--subtle);padding:2px 6px;border-radius:5px;border:1px solid var(--line-soft);white-space:nowrap}
.passed summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 2px}
.passed .checks{margin-top:6px}

/* markdown */
.md{font-size:14px;line-height:1.65;max-width:78ch;overflow-wrap:anywhere}
.md>*{margin-block:0 12px}
.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.3;margin-top:22px;font-weight:600}
.md h2{font-size:19px} .md h3{font-size:16px} .md h4{font-size:14.5px} .md h5,.md h6{font-size:13.5px}
.md code{font-family:var(--font-mono);font-size:12.5px;background:var(--chip);padding:1px 5px;border-radius:4px}
.md pre{margin:0;padding:12px 14px;background:var(--sunken);border:1px solid var(--line-soft);border-radius:var(--r);font-size:12.5px;line-height:1.55}
.md pre code{background:none;padding:0;white-space:pre}
.md ul,.md ol{padding-left:22px}
.md li+li{margin-top:3px}
.md li>ul,.md li>ol{margin-top:4px}
.md blockquote{border-left:3px solid var(--line);padding-left:12px;color:var(--muted)}
.md table{border-collapse:collapse;font-size:13px}
.md th,.md td{border:1px solid var(--line-soft);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--surface);font-weight:600}
.md hr{border:0;border-top:1px solid var(--line-soft)}
.scrollx{overflow-x:auto;max-width:100%}

/* one live list per kind: owner's collection + every author's own subtree (found through an index collection) */
function watchKind(db, libCol, idxCol, onList, onError) {
  const parts = new Map();
  const rebuild = () => onList([...parts.values()].flatMap(e => e.docs));
  const watch = scope => {
    if (parts.has(scope)) return;
    const entry = { docs: [], unsub: null }; parts.set(scope, entry);
    const col = db.collection(scope === 'lib' ? libCol : idxCol + '/' + scope + '/items');
    entry.unsub = col.onSnapshot(snap => {
      entry.docs = snap.docs.map(d => ({ ...d.data(), id: keyOf(scope, d.id), _scope: scope })).filter(s => s.name);
      rebuild();
    }, err => { if (scope === 'lib' && onError) onError(err); });
  };
  watch('lib');
  if (S.myId && !S.isOwner) watch(S.myId);
  db.collection(idxCol).onSnapshot(snap => {
    const ids = new Set(snap.docs.map(d => d.id));
    ids.forEach(watch);
    for (const [scope, e] of parts) if (scope !== 'lib' && scope !== S.myId && !ids.has(scope)) { e.unsub(); parts.delete(scope); }
    rebuild();
  }, () => {});
}

  Object.assign(S, { db, user, assets, downloads, sample });
  if (user) {

  const fail = err => { S.store = 'error'; S.storeErr = err && err.code; S.loaded = true; render(); };
